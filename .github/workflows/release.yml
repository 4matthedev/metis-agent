name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build release assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            bin="metis-agent"
            [ "$os" = "windows" ] && bin="metis-agent.exe"

            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "dist/$bin" .

            versioned="metis-agent_${version}_${os}_${arch}.tar.gz"
            stable="metis-agent_${os}_${arch}.tar.gz"
            tar -czf "dist/$versioned" -C dist "$bin"
            cp "dist/$versioned" "dist/$stable"
            rm "dist/$bin"
          done

          ( cd dist && sha256sum *.tar.gz > SHA256SUMS )
          cat dist/SHA256SUMS
          ls -lh dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
