# Metis Agent project configuration
#
# Copy this file to .metis-agent.conf and edit as needed. The legacy
# .metis-agent.json format is still read, but this format is easier to write by
# hand. Project settings override global settings.

provider = "auto"
base_url = ""
model = ""
# api_key = ""

temperature = 0.3
thinking = "none"
max_steps = 40
window = 64

shell = true
shell_timeout_sec = 120
session = true
highlight = "auto"
auto_approve = false
redact_secrets = true

# Command to run automatically after a turn changes files.
verify = ""
verify_timeout_sec = 120
embedding_model = ""

# Extra instruction files, comma-separated.
# instructions = "AGENTS.md", ".metis-agent/rules.md"

# Models to try when the active model fails.
# fallback_models = "model-a", "model-b"

# MCP servers are optional. Uncomment and edit a section to connect one.
#
# [mcp.github]
# type = "stdio"
# command = "npx"
# args = "-y", "@modelcontextprotocol/server-github"
# env.GITHUB_PERSONAL_ACCESS_TOKEN = "set-this-in-your-shell"
#
# [mcp.remote]
# type = "http"
# url = "https://mcp.example.com/mcp"
# auth_type = "bearer"
# auth_token = "set-this-in-your-shell"
